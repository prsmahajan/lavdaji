<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function () {
        try {
          const stored = localStorage.getItem("theme");
          const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          // fail silently, stay in light mode
        }
      })();
    </script>

    <title>Paras Mahajan | AI Automation & Revenue Systems</title>
    <meta
      name="description"
      content="Paras builds calm, durable AI-driven sales, marketing, and video automation systems that turn attention into revenue."
