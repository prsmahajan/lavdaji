<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function () {
        try {
          const stored = localStorage.getItem("theme");
          const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          // fail silently, stay in light mode
        }
      })();
    </script>

    <title>Paras Mahajan | AI Automation & Revenue Systems</title>
    <meta
      name="description"
      content="Paras builds calm, durable AI-driven sales, marketing, and video automation systems that turn attention into revenue."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <!-- Global SVG Filters -->
    <svg style="position: absolute; width: 0; height: 0;" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Fine grain noise filter -->
        <filter id="grain-fine">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        
        <!-- Medium grain noise filter -->
        <filter id="grain-medium">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        
        <!-- Coarse grain noise filter -->
        <filter id="grain-coarse">
          <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        
        <!-- Paper texture filter -->
        <filter id="paper-texture">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="5" seed="2" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="discrete" tableValues="1 1" />
          </feComponentTransfer>
        </filter>
      </defs>
    </svg>

    <!-- Cal element-click embed code begins -->
    <script src="/cal-init.js"></script>
    <!-- Cal element-click embed code ends -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
