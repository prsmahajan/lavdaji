<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function () {
        try {
          const stored = localStorage.getItem("theme");
          const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          // fail silently, stay in light mode
        }
      })();
    </script>

    <title>Paras Mahajan | AI Automation & Revenue Systems</title>
    <meta
      name="description"
      content="Paras builds calm, durable AI-driven sales, marketing, and video automation systems that turn attention into revenue."
    />
    <meta name="author" content="Paras Mahajan" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap"
    />

    <meta property="og:title" content="Paras Mahajan | AI Automation & Revenue Systems" />
    <meta
      property="og:description"
      content="AI video automation, sales automation, and growth systems designed for leverage — not hustle."
    />

    <link rel="canonical" href="https://prsmahajan.com" />

    <link rel="icon" href="/favicon.png" type="image/png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cal element-click embed code begins -->
    <script type="text/javascript">
      console.log("[Cal.js] Starting initialization...");
      (function (C, A, L) {
        let p = function (a, ar) {
          a.q.push(ar);
        };
        let d = C.document;
        C.Cal =
          C.Cal ||
          function () {
            let cal = C.Cal;
            let ar = arguments;
            if (!cal.loaded) {
              cal.ns = {};
              cal.q = cal.q || [];
              const script = d.createElement("script");
              script.src = A;
              script.onload = function() {
                console.log("[Cal.js] Script loaded successfully from:", A);
              };
              script.onerror = function() {
                console.error("[Cal.js] Script failed to load from:", A);
              };
              d.head.appendChild(script);
              cal.loaded = true;
              console.log("[Cal.js] Script loading from:", A);
            }
            if (ar[0] === L) {
              const api = function () {
                p(api, arguments);
              };
              const namespace = ar[1];
              api.q = api.q || [];
              if (typeof namespace === "string") {
                cal.ns[namespace] = cal.ns[namespace] || api;
                p(cal.ns[namespace], ar);
                p(cal, ["initNamespace", namespace]);
                console.log("[Cal.js] Namespace initialized:", namespace);
              } else p(cal, ar);
              return;
            }
            p(cal, ar);
          };
      })(window, "https://app.cal.com/embed/embed.js", "init");
      Cal("init", "60", { origin: "https://app.cal.com" });
      console.log("[Cal.js] Cal object after init:", {
        type: typeof window.Cal,
        ns: window.Cal?.ns ? Object.keys(window.Cal.ns) : null,
      });

      // Check if Cal actually has the embed API loaded
      setTimeout(() => {
        console.log("[Cal.js] Status check at 5 seconds:", {
          type: typeof window.Cal,
          ns: window.Cal?.ns ? Object.keys(window.Cal.ns) : null,
          hasUI: typeof window.Cal?.ns?.["60"] === 'function' ? 'yes' : 'no',
        });
      }, 5000);

      try {
        Cal.ns["60"]("ui", { hideEventTypeDetails: false, layout: "month_view" });
        console.log("[Cal.js] UI initialized for namespace 60");
      } catch (e) {
        console.error("[Cal.js] Error initializing UI:", e);
      }
    </script>
    <!-- Cal element-click embed code ends -->
  </body>
</html>
